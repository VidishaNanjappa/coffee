# Render Blueprint for the Coorg Cup backend API.
# In Render: New + > Blueprint, connect this GitHub repo, and it reads this file.
# Fill the `sync: false` env vars in the Render dashboard after the service is created.
services:
  - type: web
    name: coorg-cup-api
    runtime: node
    rootDir: backend
    plan: free
    region: singapore
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Neon Postgres connection strings (use the DIRECT/non-pooler host for both).
      - key: DATABASE_URL
        sync: false
      - key: DIRECT_URL
        sync: false
      # A long random secret is generated for you on first deploy.
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # Your deployed Vercel URL, e.g. https://coffee-xxxx.vercel.app (comma-separate multiple).
      - key: FRONTEND_URL
        sync: false
      # Optional payment gateways — leave blank to run checkout in demo mode.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
